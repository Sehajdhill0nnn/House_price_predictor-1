services:
  - type: web
    name: house-price-prediction-api
    runtime: docker
    plan: 1c-2g
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////var/data/house_prices.db
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      - key: MODEL_DIR
        value: /app/backend/trained_models
    disk:
      name: house-price-data
      mountPath: /var/data
      sizeGB: 1