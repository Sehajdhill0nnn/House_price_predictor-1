services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./house_prices.db
      CORS_ORIGINS: http://localhost:5173
      MODEL_DIR: /app/backend/trained_models
    volumes:
      - ./backend/trained_models:/app/backend/trained_models
      - ./backend/house_prices.db:/app/house_prices.db
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
